<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" width="640" height="400" shape-rendering="crispEdges">
  <!-- a summer meadow -->
  <rect width="320" height="200" fill="#4f9d3a"/>
  <g fill="#5bb044">
    <rect x="0" y="0" width="320" height="4"/><rect x="0" y="24" width="320" height="2"/><rect x="0" y="52" width="320" height="2"/>
    <rect x="0" y="88" width="320" height="2"/><rect x="0" y="130" width="320" height="2"/><rect x="0" y="172" width="320" height="2"/>
  </g>
  <g fill="#3f8a2e">
    <rect x="14" y="40" width="4" height="2"/><rect x="52" y="112" width="4" height="2"/><rect x="92" y="18" width="4" height="2"/><rect x="270" y="150" width="4" height="2"/>
    <rect x="236" y="46" width="4" height="2"/><rect x="300" y="100" width="4" height="2"/><rect x="34" y="186" width="4" height="2"/><rect x="150" y="190" width="4" height="2"/>
  </g>
  <!-- wild flowers -->
  <g>
    <rect x="30" y="60" width="2" height="2" fill="#ffd23f"/><rect x="42" y="98" width="2" height="2" fill="#ff4fa3"/><rect x="266" y="30" width="2" height="2" fill="#efe6ff"/>
    <rect x="296" y="178" width="2" height="2" fill="#ffd23f"/><rect x="12" y="150" width="2" height="2" fill="#ff4fa3"/><rect x="226" y="186" width="2" height="2" fill="#efe6ff"/>
  </g>

  <!-- the pond with a duck -->
  <rect x="232" y="118" width="60" height="36" fill="#2e7fb8"/>
  <rect x="224" y="126" width="76" height="20" fill="#2e7fb8"/>
  <rect x="240" y="124" width="44" height="24" fill="#3ff0ff" opacity=".35"/>
  <rect x="246" y="130" width="10" height="2" fill="#bdf6ff"/><rect x="270" y="142" width="8" height="2" fill="#bdf6ff"/>
  <rect x="262" y="134" width="6" height="4" fill="#ffd23f"/><rect x="266" y="130" width="4" height="4" fill="#ffd23f"/><rect x="270" y="132" width="2" height="2" fill="#ff8a3d"/>

  <!-- gravel paths from the gate -->
  <rect x="0" y="104" width="320" height="14" fill="#c9b48a"/>
  <rect x="150" y="30" width="14" height="150" fill="#c9b48a"/>
  <g fill="#b39d74">
    <rect x="20" y="108" width="4" height="2"/><rect x="70" y="112" width="4" height="2"/><rect x="120" y="106" width="4" height="2"/>
    <rect x="210" y="110" width="4" height="2"/><rect x="280" y="108" width="4" height="2"/><rect x="154" y="50" width="4" height="2"/>
    <rect x="156" y="140" width="4" height="2"/><rect x="152" y="166" width="4" height="2"/>
  </g>

  <!-- reception at the gate, with a barrier -->
  <rect x="112" y="6" width="36" height="22" fill="#e04b3a"/>
  <rect x="108" y="4" width="44" height="4" fill="#b83224"/>
  <rect x="112" y="28" width="36" height="12" fill="#f0dcc0"/>
  <rect x="116" y="30" width="8" height="8" fill="#3ff0ff"/><rect x="136" y="30" width="8" height="8" fill="#3ff0ff"/>
  <rect x="126" y="32" width="8" height="8" fill="#7a4a2a"/>
  <rect x="150" y="14" width="4" height="26" fill="#efe6ff"/>
  <rect x="152" y="16" width="30" height="4" fill="#ff4fa3"/><rect x="158" y="16" width="6" height="4" fill="#efe6ff"/><rect x="170" y="16" width="6" height="4" fill="#efe6ff"/>

  <!-- pitches with tents -->
  <g>
    <!-- orange tent -->
    <polygon points="40,56 64,92 16,92" fill="#ff8a3d"/>
    <polygon points="40,56 52,92 28,92" fill="#e06a22"/>
    <rect x="36" y="78" width="8" height="14" fill="#8a3a10"/>
    <!-- blue tent -->
    <polygon points="96,52 120,88 72,88" fill="#3c7dd6"/>
    <polygon points="96,52 108,88 84,88" fill="#2a5fae"/>
    <rect x="92" y="74" width="8" height="14" fill="#163a70"/>
    <!-- yellow tent -->
    <polygon points="60,140 84,176 36,176" fill="#ffd23f"/>
    <polygon points="60,140 72,176 48,176" fill="#e0b22a"/>
    <rect x="56" y="162" width="8" height="14" fill="#8a6a10"/>
  </g>

  <!-- caravan on the comfort pitch -->
  <rect x="190" y="52" width="52" height="30" fill="#efe6ff"/>
  <rect x="190" y="52" width="52" height="6" fill="#d9ccf0"/>
  <rect x="196" y="60" width="12" height="10" fill="#3ff0ff"/><rect x="224" y="60" width="12" height="10" fill="#3ff0ff"/>
  <rect x="212" y="62" width="8" height="20" fill="#9a7b5a"/>
  <rect x="198" y="82" width="10" height="8" fill="#05020c"/><rect x="224" y="82" width="10" height="8" fill="#05020c"/>
  <rect x="178" y="74" width="12" height="4" fill="#4b3590"/>
  <!-- awning -->
  <rect x="242" y="56" width="30" height="4" fill="#ff4fa3"/><rect x="242" y="60" width="30" height="4" fill="#efe6ff"/><rect x="242" y="64" width="30" height="4" fill="#ff4fa3"/>
  <rect x="270" y="68" width="2" height="12" fill="#4b3590"/>

  <!-- trekkers' hut by the pond -->
  <polygon points="222,152 250,152 236,140" fill="#8a3a10"/>
  <rect x="226" y="152" width="20" height="18" fill="#b5703a"/>
  <rect x="233" y="158" width="6" height="12" fill="#5a2e10"/>

  <!-- pines and an oak -->
  <g>
    <polygon points="20,16 36,44 4,44" fill="#2f6f2a"/><polygon points="20,8 32,30 8,30" fill="#3a8534"/><rect x="18" y="44" width="4" height="6" fill="#5a2e10"/>
    <polygon points="296,20 312,48 280,48" fill="#2f6f2a"/><polygon points="296,12 308,34 284,34" fill="#3a8534"/><rect x="294" y="48" width="4" height="6" fill="#5a2e10"/>
    <polygon points="300,160 316,188 284,188" fill="#2f6f2a"/><polygon points="300,152 312,174 288,174" fill="#3a8534"/><rect x="298" y="188" width="4" height="6" fill="#5a2e10"/>
    <rect x="8" y="118" width="4" height="10" fill="#5a2e10"/><rect x="0" y="100" width="20" height="18" fill="#2f6f2a"/><rect x="4" y="96" width="12" height="4" fill="#3a8534"/>
    <rect x="184" y="150" width="6" height="12" fill="#5a2e10"/><rect x="174" y="130" width="26" height="22" fill="#2f6f2a"/><rect x="178" y="126" width="18" height="4" fill="#3a8534"/><rect x="182" y="134" width="4" height="4" fill="#e04b3a"/><rect x="192" y="142" width="4" height="4" fill="#e04b3a"/>
  </g>

  <!-- campfire and a happy family -->
  <rect x="98" y="156" width="20" height="4" fill="#5a2e10"/>
  <rect x="104" y="146" width="8" height="10" fill="#ff8a3d"/><rect x="106" y="140" width="4" height="6" fill="#ffd23f"/><rect x="102" y="150" width="2" height="4" fill="#ffd23f"/>
  <g>
    <rect x="86" y="140" width="6" height="6" fill="#f0c8a0"/><rect x="85" y="146" width="8" height="10" fill="#3c7dd6"/>
    <rect x="124" y="140" width="6" height="6" fill="#f0c8a0"/><rect x="123" y="146" width="8" height="10" fill="#ff4fa3"/>
    <rect x="128" y="166" width="4" height="4" fill="#f0c8a0"/><rect x="127" y="170" width="6" height="6" fill="#7dff6a"/>
  </g>
  <!-- the sheep that wandered in -->
  <rect x="210" y="176" width="16" height="10" fill="#efe6ff"/><rect x="224" y="174" width="6" height="8" fill="#05020c"/>
  <rect x="212" y="186" width="2" height="4" fill="#05020c"/><rect x="222" y="186" width="2" height="4" fill="#05020c"/>
  <!-- bins and a lamp post -->
  <rect x="170" y="96" width="6" height="8" fill="#4b3590"/><rect x="169" y="94" width="8" height="2" fill="#7a5cd6"/>
  <rect x="136" y="90" width="2" height="14" fill="#4b3590"/><rect x="133" y="86" width="8" height="4" fill="#ffd23f"/>

  <!-- the rating -->
  <rect x="246" y="6" width="68" height="16" fill="#05020c" opacity=".7"/>
  <g fill="#ffd23f">
    <rect x="252" y="10" width="2" height="2"/><rect x="250" y="12" width="6" height="2"/><rect x="251" y="14" width="4" height="2"/><rect x="250" y="16" width="2" height="2"/><rect x="254" y="16" width="2" height="2"/>
    <rect x="264" y="10" width="2" height="2"/><rect x="262" y="12" width="6" height="2"/><rect x="263" y="14" width="4" height="2"/><rect x="262" y="16" width="2" height="2"/><rect x="266" y="16" width="2" height="2"/>
    <rect x="276" y="10" width="2" height="2"/><rect x="274" y="12" width="6" height="2"/><rect x="275" y="14" width="4" height="2"/><rect x="274" y="16" width="2" height="2"/><rect x="278" y="16" width="2" height="2"/>
    <rect x="288" y="10" width="2" height="2"/><rect x="286" y="12" width="6" height="2"/><rect x="287" y="14" width="4" height="2"/><rect x="286" y="16" width="2" height="2"/><rect x="290" y="16" width="2" height="2"/>
  </g>
  <g fill="#a898cf">
    <rect x="300" y="10" width="2" height="2"/><rect x="298" y="12" width="6" height="2"/><rect x="299" y="14" width="4" height="2"/><rect x="298" y="16" width="2" height="2"/><rect x="302" y="16" width="2" height="2"/>
  </g>
</svg>
