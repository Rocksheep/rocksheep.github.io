<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" width="640" height="400" shape-rendering="crispEdges">
  <!-- night sky over the city -->
  <rect width="320" height="200" fill="#0f0820"/>
  <rect y="60" width="320" height="40" fill="#170d33"/>
  <g fill="#efe6ff" opacity=".7">
    <rect x="22" y="14" width="2" height="2"/><rect x="61" y="27" width="2" height="2"/><rect x="104" y="9" width="2" height="2"/>
    <rect x="150" y="22" width="2" height="2"/><rect x="199" y="6" width="2" height="2"/><rect x="243" y="18" width="2" height="2"/>
    <rect x="289" y="11" width="2" height="2"/><rect x="310" y="30" width="2" height="2"/><rect x="132" y="38" width="2" height="2"/>
  </g>
  <!-- the moon -->
  <rect x="266" y="18" width="20" height="20" fill="#ffd23f"/>
  <rect x="270" y="14" width="12" height="4" fill="#ffd23f"/><rect x="270" y="38" width="12" height="4" fill="#ffd23f"/>
  <rect x="262" y="22" width="4" height="12" fill="#ffd23f"/><rect x="286" y="22" width="4" height="12" fill="#ffd23f"/>
  <rect x="274" y="22" width="4" height="4" fill="#e6b52a"/><rect x="278" y="30" width="4" height="4" fill="#e6b52a"/>

  <!-- skyline, far -->
  <g fill="#1d1340">
    <rect x="0" y="52" width="24" height="60"/><rect x="24" y="36" width="20" height="76"/><rect x="44" y="58" width="16" height="54"/>
    <rect x="60" y="44" width="28" height="68"/><rect x="88" y="62" width="14" height="50"/><rect x="102" y="30" width="22" height="82"/>
    <rect x="124" y="54" width="18" height="58"/><rect x="142" y="40" width="12" height="72"/><rect x="154" y="48" width="26" height="64"/>
    <rect x="180" y="34" width="16" height="78"/><rect x="196" y="56" width="22" height="56"/><rect x="218" y="42" width="14" height="70"/>
    <rect x="232" y="60" width="26" height="52"/><rect x="258" y="46" width="18" height="66"/><rect x="276" y="64" width="20" height="48"/>
    <rect x="296" y="50" width="24" height="62"/>
    <rect x="110" y="22" width="6" height="8"/><rect x="186" y="26" width="4" height="8"/>
  </g>
  <!-- lit windows -->
  <g fill="#ffd23f" opacity=".85">
    <rect x="28" y="42" width="3" height="3"/><rect x="36" y="42" width="3" height="3"/><rect x="28" y="52" width="3" height="3"/><rect x="36" y="62" width="3" height="3"/>
    <rect x="66" y="50" width="3" height="3"/><rect x="74" y="50" width="3" height="3"/><rect x="82" y="60" width="3" height="3"/><rect x="66" y="70" width="3" height="3"/>
    <rect x="106" y="36" width="3" height="3"/><rect x="114" y="36" width="3" height="3"/><rect x="106" y="46" width="3" height="3"/><rect x="114" y="56" width="3" height="3"/><rect x="106" y="66" width="3" height="3"/>
    <rect x="158" y="54" width="3" height="3"/><rect x="166" y="54" width="3" height="3"/><rect x="174" y="64" width="3" height="3"/><rect x="158" y="74" width="3" height="3"/>
    <rect x="184" y="40" width="3" height="3"/><rect x="184" y="50" width="3" height="3"/><rect x="190" y="60" width="3" height="3"/>
    <rect x="222" y="48" width="3" height="3"/><rect x="222" y="58" width="3" height="3"/><rect x="236" y="66" width="3" height="3"/><rect x="250" y="76" width="3" height="3"/>
    <rect x="262" y="52" width="3" height="3"/><rect x="270" y="62" width="3" height="3"/><rect x="300" y="56" width="3" height="3"/><rect x="310" y="66" width="3" height="3"/>
  </g>
  <g fill="#3ff0ff" opacity=".8">
    <rect x="48" y="64" width="3" height="3"/><rect x="92" y="68" width="3" height="3"/><rect x="128" y="60" width="3" height="3"/><rect x="146" y="46" width="3" height="3"/>
    <rect x="204" y="62" width="3" height="3"/><rect x="280" y="70" width="3" height="3"/><rect x="306" y="78" width="3" height="3"/><rect x="60" y="80" width="3" height="3"/>
  </g>
  <!-- neon signs on the roofs -->
  <rect x="100" y="24" width="26" height="6" fill="#ff4fa3"/>
  <rect x="180" y="28" width="16" height="6" fill="#3ff0ff"/>
  <rect x="24" y="30" width="20" height="6" fill="#7dff6a"/>

  <!-- wet asphalt, running away to the skyline -->
  <rect y="112" width="320" height="88" fill="#1a1230"/>
  <polygon points="130,112 190,112 320,200 0,200" fill="#2a2140"/>
  <polygon points="130,112 190,112 320,200 0,200" fill="none"/>
  <!-- kerbs -->
  <polygon points="126,112 130,112 0,200 -12,200" fill="#ff4fa3" opacity=".8"/>
  <polygon points="190,112 194,112 332,200 320,200" fill="#3ff0ff" opacity=".8"/>
  <!-- lane line -->
  <rect x="159" y="118" width="2" height="8" fill="#ffd23f"/>
  <rect x="158" y="134" width="4" height="12" fill="#ffd23f"/>
  <rect x="157" y="156" width="6" height="16" fill="#ffd23f"/>
  <rect x="156" y="184" width="8" height="16" fill="#ffd23f"/>
  <!-- neon reflections in the puddles -->
  <g opacity=".45">
    <rect x="60" y="150" width="30" height="4" fill="#ff4fa3"/><rect x="48" y="170" width="40" height="3" fill="#ff4fa3"/>
    <rect x="232" y="150" width="30" height="4" fill="#3ff0ff"/><rect x="238" y="170" width="40" height="3" fill="#3ff0ff"/>
    <rect x="110" y="190" width="100" height="6" fill="#ff4fa3"/>
  </g>

  <!-- a rival way ahead, taillights only -->
  <rect x="196" y="116" width="14" height="8" fill="#231a3c"/>
  <rect x="196" y="120" width="3" height="2" fill="#ff3b3b"/><rect x="207" y="120" width="3" height="2" fill="#ff3b3b"/>

  <!-- NOS purge cloud and tyre smoke -->
  <g fill="#efe6ff" opacity=".35">
    <rect x="84" y="150" width="10" height="6"/><rect x="78" y="156" width="14" height="6"/><rect x="88" y="162" width="8" height="4"/>
  </g>

  <!-- our car, from behind, neon underglow and all -->
  <rect x="98" y="176" width="124" height="6" fill="#ff4fa3" opacity=".9"/>
  <rect x="86" y="182" width="148" height="4" fill="#ff4fa3" opacity=".4"/>
  <rect x="72" y="186" width="176" height="4" fill="#ff4fa3" opacity=".15"/>
  <!-- spoiler (absurd) -->
  <rect x="108" y="116" width="104" height="6" fill="#efe6ff"/>
  <rect x="104" y="114" width="6" height="10" fill="#efe6ff"/><rect x="210" y="114" width="6" height="10" fill="#efe6ff"/>
  <rect x="124" y="122" width="6" height="12" fill="#c2b4e6"/><rect x="190" y="122" width="6" height="12" fill="#c2b4e6"/>
  <!-- roof accessory: the rubber duck everyone needs -->
  <rect x="150" y="118" width="10" height="8" fill="#ffd23f"/><rect x="154" y="112" width="8" height="8" fill="#ffd23f"/>
  <rect x="162" y="116" width="4" height="3" fill="#ff8a3d"/><rect x="156" y="114" width="2" height="2" fill="#05020c"/>
  <!-- roof and rear window -->
  <rect x="132" y="126" width="56" height="8" fill="#b43bff"/>
  <rect x="126" y="134" width="68" height="12" fill="#3a2a66"/>
  <rect x="130" y="136" width="60" height="8" fill="#20163a"/>
  <!-- body -->
  <rect x="112" y="146" width="96" height="30" fill="#9a2fe0"/>
  <rect x="112" y="146" width="96" height="4" fill="#c86bff"/>
  <rect x="104" y="156" width="112" height="16" fill="#8a22cc"/>
  <!-- taillights -->
  <rect x="106" y="158" width="20" height="8" fill="#ff3b3b"/><rect x="194" y="158" width="20" height="8" fill="#ff3b3b"/>
  <rect x="108" y="160" width="6" height="4" fill="#ffb3b3"/><rect x="206" y="160" width="6" height="4" fill="#ffb3b3"/>
  <!-- plate -->
  <rect x="146" y="162" width="28" height="8" fill="#efe6ff"/>
  <g fill="#05020c"><rect x="149" y="165" width="4" height="2"/><rect x="155" y="165" width="4" height="2"/><rect x="161" y="165" width="4" height="2"/><rect x="167" y="165" width="4" height="2"/></g>
  <!-- wheels -->
  <rect x="98" y="166" width="14" height="14" fill="#05020c"/><rect x="208" y="166" width="14" height="14" fill="#05020c"/>
  <rect x="103" y="171" width="4" height="4" fill="#3ff0ff"/><rect x="213" y="171" width="4" height="4" fill="#3ff0ff"/>
  <!-- twin exhausts, lit -->
  <rect x="128" y="174" width="8" height="4" fill="#05020c"/><rect x="184" y="174" width="8" height="4" fill="#05020c"/>
  <rect x="130" y="178" width="4" height="4" fill="#ffd23f"/><rect x="186" y="178" width="4" height="4" fill="#ffd23f"/>
  <rect x="131" y="182" width="2" height="3" fill="#ff8a3d"/><rect x="187" y="182" width="2" height="3" fill="#ff8a3d"/>

  <!-- speed lines -->
  <g fill="#efe6ff" opacity=".5">
    <rect x="8" y="128" width="24" height="2"/><rect x="18" y="140" width="16" height="2"/><rect x="4" y="160" width="20" height="2"/>
    <rect x="288" y="128" width="24" height="2"/><rect x="286" y="140" width="16" height="2"/><rect x="296" y="160" width="20" height="2"/>
  </g>
</svg>
