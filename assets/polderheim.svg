<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" width="640" height="400">
  <defs>
    <pattern id="grass" width="16" height="16" patternUnits="userSpaceOnUse">
      <rect width="16" height="16" fill="#6c963f"/>
      <rect width="8" height="8" fill="#72a044"/>
      <rect x="8" y="8" width="8" height="8" fill="#668f3a"/>
      <rect x="3" y="11" width="2" height="2" fill="#86b250"/>
      <rect x="12" y="3" width="2" height="2" fill="#5b8433"/>
    </pattern>
    <pattern id="thatch" width="6" height="6" patternUnits="userSpaceOnUse">
      <rect width="6" height="6" fill="#c3a25e"/>
      <rect x="1" width="1" height="6" fill="#a8873f"/>
      <rect x="4" y="2" width="1" height="4" fill="#d8bb72"/>
    </pattern>
    <pattern id="brick" width="8" height="4" patternUnits="userSpaceOnUse">
      <rect width="8" height="4" fill="#9b4a32"/>
      <rect y="3" width="8" height="1" fill="#c88a6a"/>
      <rect x="3" width="1" height="3" fill="#c88a6a"/>
    </pattern>
    <g id="tree">
      <ellipse cx="6" cy="12" rx="10" ry="3" fill="#000" fill-opacity=".22"/>
      <rect x="-2" y="2" width="4" height="10" fill="#4e3a26"/>
      <circle cx="-5" cy="0" r="7" fill="#294a1c"/><circle cx="5" cy="0" r="7" fill="#355f24"/>
      <circle cx="0" cy="-5" r="8" fill="#4a7a2c"/><circle cx="-2" cy="-8" r="4" fill="#86b250"/>
    </g>
    <g id="cow">
      <rect x="-5" y="-4" width="10" height="5" fill="#f2f0ea"/>
      <rect x="-3" y="-4" width="3" height="3" fill="#1e1e1e"/><rect x="2" y="-2" width="2" height="2" fill="#1e1e1e"/>
      <rect x="5" y="-5" width="3" height="3" fill="#1e1e1e"/>
      <rect x="-4" y="1" width="1" height="3" fill="#2a2a2a"/><rect x="3" y="1" width="1" height="3" fill="#2a2a2a"/>
    </g>
  </defs>

  <!-- sky and the North Sea -->
  <rect width="320" height="200" fill="#a9c4cf"/>
  <rect y="0" width="320" height="30" fill="#c6d8dc"/>
  <g fill="#e8eef0"><rect x="30" y="14" width="40" height="6"/><rect x="38" y="9" width="22" height="6"/><rect x="200" y="20" width="50" height="6"/><rect x="212" y="15" width="26" height="6"/></g>
  <rect y="52" width="320" height="40" fill="#2f6a80"/>
  <g fill="#5d98a8"><rect x="20" y="60" width="14" height="2"/><rect x="90" y="70" width="12" height="2"/><rect x="160" y="58" width="16" height="2"/><rect x="250" y="66" width="12" height="2"/><rect x="60" y="80" width="10" height="2"/><rect x="200" y="82" width="14" height="2"/></g>
  <!-- a little ship of Nehalennia -->
  <rect x="268" y="56" width="22" height="5" fill="#5a3d26"/><rect x="278" y="38" width="2" height="18" fill="#4a3420"/>
  <rect x="280" y="40" width="10" height="13" fill="#e8e0cc"/><rect x="280" y="44" width="10" height="3" fill="#b8443a"/>

  <!-- the dike holding back the sea -->
  <rect y="88" width="320" height="12" fill="#82a652"/>
  <rect y="88" width="320" height="3" fill="#a8c86a"/>
  <rect y="98" width="320" height="4" fill="#5a7a36"/>
  <!-- the land -->
  <rect y="100" width="320" height="100" fill="url(#grass)"/>
  <path d="M0 150 C70 142 120 128 170 128 C220 128 260 140 320 150" fill="none" stroke="#a68a5e" stroke-width="12"/>
  <path d="M0 150 C70 142 120 128 170 128 C220 128 260 140 320 150" fill="none" stroke="#8a6e46" stroke-width="2" stroke-dasharray="4 6"/>

  <!-- rye field -->
  <rect x="226" y="160" width="94" height="40" fill="#d8b04a"/>
  <g fill="#b8903a"><rect x="226" y="166" width="94" height="2"/><rect x="226" y="174" width="94" height="2"/><rect x="226" y="182" width="94" height="2"/><rect x="226" y="190" width="94" height="2"/></g>

  <!-- temple on its terp -->
  <ellipse cx="62" cy="122" rx="40" ry="9" fill="#5f7a34"/>
  <rect x="34" y="96" width="50" height="22" fill="#5d4330"/>
  <g fill="#4a3424"><rect x="40" y="96" width="2" height="22"/><rect x="50" y="96" width="2" height="22"/><rect x="66" y="96" width="2" height="22"/><rect x="76" y="96" width="2" height="22"/></g>
  <polygon points="28,98 59,70 90,98" fill="#4c3c2e"/>
  <polygon points="34,98 59,76 59,98" fill="#5a4838"/>
  <rect x="56" y="104" width="7" height="14" fill="#1a100a"/>
  <g fill="#3a2a1c"><rect x="55" y="64" width="3" height="8" transform="rotate(-35 56 68)"/><rect x="61" y="64" width="3" height="8" transform="rotate(35 62 68)"/></g>
  <rect x="96" y="76" width="2" height="44" fill="#3b2a1a"/>
  <polygon points="98,77 112,80 110,84 113,88 98,88" fill="#d0503f"/>

  <!-- thatched cottage -->
  <rect x="122" y="112" width="40" height="20" fill="#e2d6bc"/>
  <g fill="#5a3e24"><rect x="122" y="112" width="40" height="2"/><rect x="122" y="121" width="40" height="2"/><rect x="122" y="112" width="2" height="20"/><rect x="141" y="112" width="2" height="20"/><rect x="160" y="112" width="2" height="20"/></g>
  <rect x="146" y="122" width="6" height="10" fill="#3a2616"/>
  <rect x="128" y="116" width="6" height="4" fill="#30404a"/>
  <polygon points="116,114 142,88 168,114" fill="url(#thatch)"/>
  <rect x="116" y="112" width="52" height="3" fill="#7a5a28"/>
  <rect x="150" y="92" width="4" height="10" fill="#8a4a34"/>
  <g fill="#e1e1dc" fill-opacity=".6"><rect x="151" y="84" width="4" height="4"/><rect x="155" y="78" width="5" height="5"/><rect x="160" y="71" width="6" height="5"/></g>

  <!-- stepped-gable townhouse -->
  <rect x="182" y="84" width="34" height="50" fill="url(#brick)"/>
  <polygon points="182,84 182,78 186,78 186,72 190,72 190,66 194,66 194,60 204,60 204,66 208,66 208,72 212,72 212,78 216,78 216,84" fill="url(#brick)"/>
  <g fill="#26323c" stroke="#f2ece0" stroke-width="1.5">
    <rect x="187" y="90" width="7" height="9"/><rect x="204" y="90" width="7" height="9"/>
    <rect x="187" y="106" width="7" height="9"/><rect x="204" y="106" width="7" height="9"/>
    <rect x="196" y="70" width="6" height="8"/>
  </g>
  <rect x="195" y="120" width="8" height="14" fill="#3a2414" stroke="#e6dccb" stroke-width="1.5"/>
  <rect x="216" y="84" width="10" height="50" fill="#6e3424"/>
  <polygon points="216,84 216,60 226,72 226,84" fill="#7d3626"/>

  <!-- well and folk -->
  <rect x="92" y="150" width="16" height="9" fill="#8e8c80"/><rect x="92" y="148" width="16" height="3" fill="#b4b0a2"/>
  <rect x="93" y="134" width="2" height="15" fill="#5a3e24"/><rect x="105" y="134" width="2" height="15" fill="#5a3e24"/><rect x="92" y="133" width="16" height="2" fill="#5a3e24"/>
  <g><rect x="120" y="140" width="5" height="8" fill="#c0483a"/><rect x="121" y="136" width="3" height="3" fill="#e3bd98"/><rect x="119" y="133" width="7" height="2" fill="#d8b04a"/></g>
  <g><rect x="166" y="138" width="5" height="9" fill="#d0503f"/><rect x="167" y="134" width="3" height="3" fill="#e3bd98"/><rect x="172" y="132" width="1" height="15" fill="#6a4a28"/></g>

  <!-- cows on the meadow -->
  <use href="#cow" x="30" y="176"/><use href="#cow" x="58" y="186"/><use href="#cow" x="88" y="174"/>
  <g fill="#6b4e30"><rect x="10" y="164" width="2" height="8"/><rect x="40" y="164" width="2" height="8"/><rect x="70" y="164" width="2" height="8"/><rect x="100" y="164" width="2" height="8"/><rect x="130" y="164" width="2" height="8"/><rect x="0" y="166" width="140" height="1.5"/></g>

  <use href="#tree" x="246" y="118"/><use href="#tree" x="268" y="126"/><use href="#tree" x="296" y="116"/><use href="#tree" x="12" y="124"/>
</svg>
