    <path d="M16 4h2v1h-2z" fill="#ffd23f"/><path d="M16 3h1v1h-1zM16 5h1v1h-1z" fill="#ff8a3c"/>
  </g>

  <!-- cursor on the red tank, HP digits, damage window -->
  <use href="#cur" x="134" y="90" fill="#0f0820" fill-opacity=".7"/>
  <use href="#cur" x="133" y="89" fill="#ffd23f"/>
  <rect x="150" y="104" width="9" height="12" fill="#0f0820" fill-opacity=".85"/>
  <use href="#n7" transform="translate(151 105) scale(2)" fill="#fff"/>
  <rect x="222" y="104" width="9" height="12" fill="#0f0820" fill-opacity=".85"/>
  <use href="#n4" transform="translate(223 105) scale(2)" fill="#fff"/>

