<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" width="640" height="400" shape-rendering="crispEdges">
  <defs>
    <!-- 24px map tiles, grid origin at (-8,-4) so both edges are cut like a scrolled map -->
    <pattern id="grass" x="-8" y="-4" width="24" height="24" patternUnits="userSpaceOnUse">
      <rect width="24" height="24" fill="#63b048"/>
      <rect x="3" y="5" width="2" height="2" fill="#7bc85f"/><rect x="14" y="2" width="2" height="2" fill="#7bc85f"/>
      <rect x="19" y="16" width="2" height="2" fill="#7bc85f"/><rect x="9" y="19" width="2" height="1" fill="#7bc85f"/>
      <rect x="8" y="12" width="2" height="2" fill="#56a03e"/><rect x="21" y="7" width="2" height="2" fill="#56a03e"/>
      <rect x="12" y="21" width="3" height="1" fill="#56a03e"/><rect x="1" y="14" width="1" height="2" fill="#56a03e"/>
    </pattern>
    <pattern id="grid" x="-8" y="-4" width="24" height="24" patternUnits="userSpaceOnUse">
      <rect x="23" width="1" height="24" fill="#000" fill-opacity=".14"/>
      <rect y="23" width="24" height="1" fill="#000" fill-opacity=".14"/>
    </pattern>

    <!-- 3x5 pixel digits, unit coordinates, scale(2) at use -->
    <path id="n0" d="M0 0h3v1H0zM0 1h1v3H0zM2 1h1v3h-1zM0 4h3v1H0z"/>
    <path id="n1" d="M1 0h1v5H1zM0 1h1v1H0zM0 4h3v1H0z"/>
    <path id="n2" d="M0 0h3v1H0zM2 1h1v1h-1zM0 2h3v1H0zM0 3h1v1H0zM0 4h3v1H0z"/>
    <path id="n4" d="M0 0h1v3H0zM2 0h1v5h-1zM0 2h3v1H0z"/>
    <path id="n6" d="M0 0h3v1H0zM0 1h1v4H0zM0 2h3v1H0zM2 3h1v1h-1zM0 4h3v1H0z"/>
    <path id="n7" d="M0 0h3v1H0zM2 1h1v1h-1zM1 2h1v3H1z"/>
    <path id="pct" d="M0 0h1v1H0zM2 0h1v2h-1zM1 2h1v1H1zM0 3h1v2H0zM2 4h1v1h-1z"/>

    <!-- unit silhouettes in 2px units: drawn once as an outline (stroke), once in the army colour -->
    <path id="tankSil" d="M4 0h5v1H4zM3 1h13v1H3zM2 2h8v1H2zM1 3h10v1H1zM0 4h12v2H0zM1 6h10v1H1zM2 7h8v1H2z"/>
    <path id="artySil" d="M9 0h2v1H9zM8 1h2v1H8zM7 2h2v1H7zM3 3h6v1H3zM0 4h12v2H0zM1 6h10v1H1zM2 7h8v1H2z"/>
    <path id="apcSil" d="M9 0h1v1H9zM1 1h9v1H1zM0 2h12v2H0zM1 4h10v1H1zM2 5h8v1H2z"/>
    <path id="infSil" d="M1 0h3v1H1zM0 1h5v1H0zM1 2h3v1H1zM0 3h5v2H0zM1 5h1v2H1zM3 5h1v2H3zM5 1h1v4H5z"/>
    <path id="heliSil" d="M2 0h16v1H2zM9 1h2v1H9zM0 1h1v6H0zM8 2h8v1H8zM1 3h17v2H1zM7 5h11v1H7zM8 6h8v1H8zM9 7h1v1H9zM14 7h1v1h-1zM7 8h10v1H7z"/>
    <path id="jetSil" d="M13 0h2v1h-2zM12 1h3v1h-3zM4 2h4v1H4zM11 2h4v1h-4zM2 3h14v1H2zM0 4h16v1H0zM2 5h14v1H2zM6 6h8v1H6zM8 7h4v1H8z"/>

    <g id="tree">
      <rect x="4" width="4" height="2" fill="#5fb34a"/>
      <rect x="2" y="2" width="8" height="2" fill="#3f8f33"/>
      <rect y="4" width="12" height="6" fill="#2f7228"/>
      <rect x="3" y="4" width="3" height="3" fill="#4fa23f"/>
      <rect x="2" y="10" width="8" height="2" fill="#265f20"/>
      <rect x="5" y="12" width="2" height="4" fill="#5a3a1e"/>
    </g>
    <g id="woods">
      <rect x="1" y="17" width="22" height="2" fill="#000" fill-opacity=".18"/>
      <use href="#tree" x="1" y="1"/><use href="#tree" x="11" y="4"/><use href="#tree" x="5" y="8"/>
    </g>
    <g id="mtn">
      <rect x="1" y="22" width="22" height="2" fill="#000" fill-opacity=".2"/>
      <path d="M11 4h2v3h2v3h2v3h2v3h2v3h2v3H1v-3h2v-3h2v-3h2v-3h2v-3h2v-3z" fill="#6b5e50"/>
      <path d="M11 4h1v18H1v-3h2v-3h2v-3h2v-3h2v-3h2v-3z" fill="#a08f7a"/>
      <rect x="11" y="4" width="2" height="3" fill="#f4f4f8"/><rect x="9" y="7" width="6" height="3" fill="#f4f4f8"/>
      <rect x="12" y="4" width="1" height="3" fill="#d0d4de"/><rect x="12" y="7" width="3" height="3" fill="#d0d4de"/>
    </g>
    <!-- city and factory take the owner's colour through currentColor -->
    <g id="city">
      <rect x="2" y="21" width="21" height="2" fill="#000" fill-opacity=".2"/>
      <rect x="3" y="8" width="9" height="14" fill="#d9d5e3"/><rect x="10" y="8" width="2" height="14" fill="#a39db3"/>
      <rect x="5" y="11" width="2" height="2" fill="#2d3a6a"/><rect x="5" y="15" width="2" height="2" fill="#2d3a6a"/>
      <rect x="8" y="11" width="2" height="2" fill="#2d3a6a"/><rect x="8" y="15" width="2" height="2" fill="#2d3a6a"/>
      <rect x="2" y="5" width="11" height="4" fill="currentColor"/>
      <rect x="2" y="5" width="11" height="1" fill="#fff" fill-opacity=".35"/><rect x="2" y="8" width="11" height="1" fill="#000" fill-opacity=".35"/>
      <rect x="13" y="12" width="9" height="10" fill="#cfcadb"/><rect x="20" y="12" width="2" height="10" fill="#9a93ab"/>
      <rect x="14" y="14" width="2" height="2" fill="#2d3a6a"/><rect x="16" y="17" width="3" height="5" fill="#3a2a3a"/>
      <rect x="12" y="9" width="11" height="4" fill="currentColor"/>
      <rect x="12" y="9" width="11" height="1" fill="#fff" fill-opacity=".35"/><rect x="12" y="12" width="11" height="1" fill="#000" fill-opacity=".35"/>
      <rect x="18" y="1" width="1" height="8" fill="#3a3a48"/><rect x="19" y="1" width="4" height="3" fill="currentColor"/>
      <rect x="3" y="21" width="19" height="1" fill="#4a4458"/>
    </g>
    <g id="fac">
      <rect x="1" y="21" width="22" height="2" fill="#000" fill-opacity=".2"/>
      <rect x="3" y="-1" width="4" height="10" fill="#6b6580"/><rect x="3" y="-1" width="4" height="2" fill="#7a3b2e"/>
      <rect x="4" y="-4" width="3" height="2" fill="#e6e6ee" fill-opacity=".7"/><rect x="6" y="-7" width="3" height="2" fill="#e6e6ee" fill-opacity=".5"/>
      <rect x="2" y="9" width="20" height="13" fill="#b9b3c6"/><rect x="18" y="9" width="4" height="13" fill="#8c86a0"/>
      <rect x="2" y="6" width="20" height="3" fill="currentColor"/><rect x="2" y="6" width="20" height="1" fill="#fff" fill-opacity=".3"/>
      <rect x="8" y="3" width="4" height="3" fill="#6b6580"/><rect x="14" y="3" width="4" height="3" fill="#6b6580"/>
      <rect x="8" y="3" width="4" height="1" fill="#8fd3ff"/><rect x="14" y="3" width="4" height="1" fill="#8fd3ff"/>
      <rect x="4" y="12" width="3" height="3" fill="#2d3a6a"/><rect x="15" y="12" width="2" height="3" fill="#2d3a6a"/>
      <rect x="9" y="14" width="6" height="8" fill="currentColor"/><rect x="11" y="14" width="1" height="8" fill="#000" fill-opacity=".3"/>
      <rect x="2" y="21" width="20" height="1" fill="#4a4458"/>
    </g>
    <g id="cur">
      <rect width="9" height="3"/><rect width="3" height="9"/>
      <rect x="21" width="9" height="3"/><rect x="27" width="3" height="9"/>
      <rect y="27" width="9" height="3"/><rect y="21" width="3" height="9"/>
      <rect x="21" y="27" width="9" height="3"/><rect x="27" y="21" width="3" height="9"/>
    </g>
    <g id="sheep">
      <rect width="8" height="5" fill="#f4f4f4"/><rect x="7" y="-2" width="3" height="3" fill="#222"/>
      <rect x="1" y="5" width="1" height="2" fill="#222"/><rect x="6" y="5" width="1" height="2" fill="#222"/>
    </g>
  </defs>

  <!-- plains -->
  <rect width="320" height="200" fill="url(#grass)"/>

  <!-- the river with a bend, sandy banks -->
  <path d="M208 -4H232V68H208V212H184V44H208Z" fill="#e4d394" stroke="#e4d394" stroke-width="4"/>
  <path d="M208 -4H232V68H208V212H184V44H208Z" fill="#3f84d6"/>
  <g fill="#9ccaf4">
    <rect x="213" y="8" width="6" height="1"/><rect x="220" y="30" width="6" height="1"/><rect x="214" y="52" width="4" height="1"/>
    <rect x="190" y="78" width="6" height="1"/><rect x="194" y="128" width="6" height="1"/><rect x="188" y="172" width="6" height="1"/>
    <rect x="196" y="194" width="5" height="1"/><rect x="186" y="60" width="4" height="1"/>
  </g>
  <!-- rubber duck, essential military asset -->
  <rect x="188" y="154" width="8" height="1" fill="#9ccaf4"/>
  <rect x="190" y="151" width="4" height="3" fill="#ffd23f"/><rect x="193" y="149" width="2" height="2" fill="#ffd23f"/><rect x="195" y="150" width="1" height="1" fill="#ff8a3c"/>

  <!-- road between the two factories, bridge over the river -->
  <rect x="64" y="92" width="216" height="24" fill="#d1bd8c"/>
  <rect x="64" y="92" width="216" height="2" fill="#b39d6b"/><rect x="64" y="114" width="216" height="2" fill="#b39d6b"/>
  <rect x="184" y="94" width="24" height="20" fill="#c9a76a"/>
  <g fill="#a8864c"><rect x="188" y="94" width="1" height="20"/><rect x="192" y="94" width="1" height="20"/><rect x="196" y="94" width="1" height="20"/><rect x="200" y="94" width="1" height="20"/><rect x="204" y="94" width="1" height="20"/></g>
  <rect x="184" y="92" width="24" height="2" fill="#6e4e2c"/><rect x="184" y="114" width="24" height="2" fill="#6e4e2c"/>

  <rect width="320" height="200" fill="url(#grid)"/>

  <!-- terrain features -->
  <use href="#woods" x="-8" y="20"/><use href="#woods" x="16" y="20"/><use href="#woods" x="-8" y="44"/><use href="#woods" x="16" y="44"/>
  <use href="#woods" x="160" y="-4"/><use href="#woods" x="184" y="-4"/><use href="#woods" x="136" y="20"/><use href="#woods" x="232" y="44"/>
  <use href="#woods" x="64" y="140"/><use href="#woods" x="40" y="164"/><use href="#woods" x="208" y="188"/>
  <use href="#woods" x="280" y="164"/><use href="#woods" x="304" y="164"/><use href="#woods" x="280" y="188"/><use href="#woods" x="304" y="188"/>
  <use href="#mtn" x="16" y="140"/><use href="#mtn" x="256" y="164"/><use href="#mtn" x="88" y="188"/>
  <use href="#sheep" x="44" y="193"/><use href="#sheep" x="58" y="190"/>

  <!-- properties -->
  <use href="#fac" x="40" y="92" color="#e8453c"/>
  <use href="#fac" x="280" y="92" color="#3d7bff"/>
  <use href="#city" x="88" y="44" color="#e8453c"/>
  <use href="#city" x="232" y="140" color="#3d7bff"/>
  <use href="#city" x="136" y="164" color="#9a9aa8"/>

  <!-- shadows of the aircraft -->
  <use href="#heliSil" transform="translate(126 66) scale(2)" fill="#000" opacity=".22"/>
  <use href="#jetSil" transform="translate(248 30) scale(2)" fill="#000" opacity=".22"/>

  <!-- red infantry capturing the neutral city -->
  <g transform="translate(122 172) scale(2)">
    <use href="#infSil" fill="#1a0f2a" stroke="#1a0f2a" stroke-width="1"/>
    <use href="#infSil" fill="#e8453c"/>
    <path d="M1 2h3v1H1z" fill="#f1c9a0"/><path d="M3 2h1v1H3z" fill="#1a0f2a"/>
    <path d="M0 4h5v1H0z" fill="#8c1d1d"/><path d="M1 5h1v2H1zM3 5h1v2H3z" fill="#2c2838"/><path d="M5 1h1v4H5z" fill="#3a3a48"/>
  </g>
  <!-- blue infantry near the blue city -->
  <g transform="translate(274 122) scale(-2 2)">
    <use href="#infSil" fill="#1a0f2a" stroke="#1a0f2a" stroke-width="1"/>
    <use href="#infSil" fill="#3d7bff"/>
    <path d="M1 2h3v1H1z" fill="#f1c9a0"/><path d="M3 2h1v1H3z" fill="#1a0f2a"/>
    <path d="M0 4h5v1H0z" fill="#1d3f99"/><path d="M1 5h1v2H1zM3 5h1v2H3z" fill="#2c2838"/><path d="M5 1h1v4H5z" fill="#3a3a48"/>
  </g>

  <!-- red artillery behind the tank -->
  <g transform="translate(112 100) scale(2)">
    <use href="#artySil" fill="#1a0f2a" stroke="#1a0f2a" stroke-width="1"/>
    <use href="#artySil" fill="#e8453c"/>
    <path d="M9 0h2v1H9zM8 1h2v1H8zM7 2h2v1H7z" fill="#3a3a48"/><path d="M3 3h6v1H3z" fill="#8c1d1d"/>
    <path d="M0 4h9v1H0z" fill="#ff8f86"/><path d="M0 5h12v1H0z" fill="#8c1d1d"/>
    <path d="M1 6h10v1H1zM2 7h8v1H2z" fill="#2c2838"/><path d="M2 6h1v1H2zM4 6h1v1H4zM6 6h1v1H6zM8 6h1v1H8zM10 6h1v1h-1z" fill="#7a7690"/>
  </g>

  <!-- red APC rolling up behind the lines -->
  <g transform="translate(64 122) scale(2)">
    <use href="#apcSil" fill="#1a0f2a" stroke="#1a0f2a" stroke-width="1"/>
    <use href="#apcSil" fill="#e8453c"/>
    <path d="M1 1h7v1H1z" fill="#ff8f86"/><path d="M9 0h1v1H9z" fill="#3a3a48"/><path d="M0 3h12v1H0z" fill="#8c1d1d"/>
    <path d="M3 2h2v1H3zM7 2h2v1H7z" fill="#1a0f2a"/>
    <path d="M1 4h10v1H1zM2 5h8v1H2z" fill="#2c2838"/><path d="M2 4h1v1H2zM4 4h1v1H4zM6 4h1v1H6zM8 4h1v1H8zM10 4h1v1h-1z" fill="#7a7690"/>
  </g>
  <!-- second blue tank coming down from the north -->
  <g transform="translate(280 74) scale(-2 2)">
    <use href="#tankSil" fill="#1a0f2a" stroke="#1a0f2a" stroke-width="1"/>
    <use href="#tankSil" fill="#3d7bff"/>
    <path d="M2 2h8v1H2zM0 5h12v1H0z" fill="#1d3f99"/><path d="M5 0h2v1H5z" fill="#1d3f99"/>
    <path d="M1 3h8v1H1z" fill="#8db2ff"/>
    <path d="M10 1h6v1h-6z" fill="#3a3a48"/><path d="M14 1h2v1h-2z" fill="#5a5a6a"/>
    <path d="M1 6h10v1H1zM2 7h8v1H2z" fill="#2c2838"/><path d="M2 6h1v1H2zM4 6h1v1H4zM6 6h1v1H6zM8 6h1v1H8zM10 6h1v1h-1z" fill="#7a7690"/>
  </g>

  <!-- red tank, selected, firing -->
  <g transform="translate(136 98) scale(2)">
    <use href="#tankSil" fill="#1a0f2a" stroke="#1a0f2a" stroke-width="1"/>
    <use href="#tankSil" fill="#e8453c"/>
    <path d="M2 2h8v1H2zM0 5h12v1H0z" fill="#8c1d1d"/><path d="M5 0h2v1H5z" fill="#8c1d1d"/>
    <path d="M1 3h8v1H1z" fill="#ff8f86"/>
    <path d="M10 1h6v1h-6z" fill="#3a3a48"/><path d="M14 1h2v1h-2z" fill="#5a5a6a"/>
    <path d="M1 6h10v1H1zM2 7h8v1H2z" fill="#2c2838"/><path d="M2 6h1v1H2zM4 6h1v1H4zM6 6h1v1H6zM8 6h1v1H8zM10 6h1v1h-1z" fill="#7a7690"/>
  </g>
  <!-- muzzle flash and the shell on its way -->
  <g fill="#ffd23f">
    <rect x="168" y="97" width="8" height="8"/><rect x="170" y="94" width="4" height="14"/><rect x="176" y="100" width="4" height="2"/>
  </g>
  <rect x="168" y="100" width="4" height="2" fill="#fff"/>
  <rect x="189" y="100" width="6" height="3" fill="#2c2838"/><rect x="195" y="101" width="1" height="1" fill="#2c2838"/>
  <rect x="183" y="101" width="4" height="1" fill="#fff" fill-opacity=".6"/><rect x="179" y="101" width="2" height="1" fill="#fff" fill-opacity=".4"/>

  <!-- blue tank, taking the hit -->
  <g transform="translate(232 98) scale(-2 2)">
    <use href="#tankSil" fill="#1a0f2a" stroke="#1a0f2a" stroke-width="1"/>
    <use href="#tankSil" fill="#3d7bff"/>
    <path d="M2 2h8v1H2zM0 5h12v1H0z" fill="#1d3f99"/><path d="M5 0h2v1H5z" fill="#1d3f99"/>
    <path d="M1 3h8v1H1z" fill="#8db2ff"/>
    <path d="M10 1h6v1h-6z" fill="#3a3a48"/><path d="M14 1h2v1h-2z" fill="#5a5a6a"/>
    <path d="M1 6h10v1H1zM2 7h8v1H2z" fill="#2c2838"/><path d="M2 6h1v1H2zM4 6h1v1H4zM6 6h1v1H6zM8 6h1v1H8zM10 6h1v1h-1z" fill="#7a7690"/>
  </g>
  <g>
    <rect x="199" y="103" width="18" height="3" fill="#ff8a3c"/><rect x="206" y="95" width="3" height="18" fill="#ff8a3c"/>
    <rect x="202" y="99" width="11" height="10" fill="#ff8a3c"/>
    <rect x="204" y="101" width="7" height="6" fill="#ffd23f"/><rect x="206" y="103" width="3" height="2" fill="#fff"/>
    <g fill="#ffd23f"><rect x="198" y="97" width="2" height="2"/><rect x="215" y="96" width="2" height="2"/><rect x="198" y="110" width="2" height="2"/><rect x="215" y="111" width="2" height="2"/></g>
    <rect x="211" y="92" width="4" height="3" fill="#d8d8e0" fill-opacity=".7"/><rect x="214" y="88" width="3" height="3" fill="#d8d8e0" fill-opacity=".5"/>
  </g>

  <!-- red attack helicopter -->
  <g transform="translate(118 50) scale(2)">
    <use href="#heliSil" fill="#1a0f2a" stroke="#1a0f2a" stroke-width="1"/>
    <use href="#heliSil" fill="#e8453c"/>
    <path d="M2 0h16v1H2z" fill="#d8d8e2"/><path d="M4 0h1v1H4zM8 0h1v1H8zM12 0h1v1h-1zM16 0h1v1h-1z" fill="#8a8a9a"/>
    <path d="M9 1h2v1H9z" fill="#3a3a48"/><path d="M0 1h1v6H0z" fill="#b8b8c4"/><path d="M0 3h1v2H0z" fill="#3a3a48"/>
    <path d="M8 2h7v1H8z" fill="#ff8f86"/><path d="M15 3h3v2h-3z" fill="#1a0f2a"/><path d="M16 3h1v1h-1z" fill="#3ff0ff"/>
    <path d="M7 5h8v1H7z" fill="#8c1d1d"/><path d="M9 6h4v1H9z" fill="#3a3a48"/>
    <path d="M9 7h1v1H9zM14 7h1v1h-1zM7 8h10v1H7z" fill="#5a5a6a"/>
  </g>

  <!-- blue jet, afterburner on -->
  <g transform="translate(238 14) scale(2)">
    <path d="M19 4h3v1h-3zM24 4h4v1h-4zM30 4h3v1h-3z" fill="#3ff0ff" fill-opacity=".75"/>
    <use href="#jetSil" fill="#1a0f2a" stroke="#1a0f2a" stroke-width="1"/>
    <use href="#jetSil" fill="#3d7bff"/>
    <path d="M13 0h2v1h-2zM12 1h3v1h-3zM11 2h4v1h-4z" fill="#1d3f99"/>
    <path d="M6 6h8v1H6zM8 7h4v1H8z" fill="#1d3f99"/>
    <path d="M2 3h9v1H2z" fill="#8db2ff"/><path d="M0 4h2v1H0z" fill="#c9c9d8"/>
    <path d="M4 2h4v1H4z" fill="#1a0f2a"/><path d="M5 2h1v1H5z" fill="#3ff0ff"/>
